<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zappis sa presťahoval</title>
<meta http-equiv="refresh" content="6; url=https://cromwellgroup-nastroje.web.app/zappis/">
<script>
  var n=5; setInterval(function(){ n--; var e=document.getElementById("s"); if(e&&n>=0) e.textContent=n; },1000);
  setTimeout(function(){ location.replace("https://cromwellgroup-nastroje.web.app/zappis/"); }, 5000);
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F6FA;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1F2A44;padding:16px;box-sizing:border-box}
  .box{background:#fff;border:1px solid #DDE2EA;border-radius:12px;padding:28px 32px;max-width:440px;text-align:center;box-shadow:0 4px 18px rgba(31,42,68,.06)}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 18px;color:#5A6478}
  a.btn{display:inline-block;background:#3E56CB;color:#fff;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:8px}
  .pozn{background:#FFF8E6;border:1px solid #F1DFAE;border-radius:8px;padding:10px 12px;color:#6B5A2E;font-size:14px;text-align:left}
  .odp{font-size:13px;margin-bottom:14px}
  .url{display:block;margin-top:14px;font-size:13px;color:#3E56CB;word-break:break-all}
</style>
</head>
<body>
  <div class="box">
    <h1>Zappis sa presťahoval</h1>
    <p>Zappis má novú adresu. Prosím, zmeňte si záložku.</p>
    <p class="pozn">Prvé otvorenie na novej adrese môže trvať dlhšie, pretože sa načítavajú všetky záznamy. Každé ďalšie otvorenie už prebehne normálne.</p>
    <p class="odp">Presmerujeme vás o <b id="s">5</b> s…</p>
    <a class="btn" href="https://cromwellgroup-nastroje.web.app/zappis/">Otvoriť Zappis</a>
    <span class="url">cromwellgroup-nastroje.web.app/zappis/</span>
  </div>
</body>
</html>
